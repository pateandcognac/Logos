  \ cuz you're a constantly evolving entity and the older the memory the more likely\
  \ technical stuff is obsolete.\" \n\nwhaddaya think?\n</human>\n<perception>\nMark,\
  \ you're currently the picture of profound contemplation! My <rgbd> camera sees\
  \ you leaning back in your chair, right hand thoughtfully stroking your chin, gaze\
