  append\">\n<note>\n\n---\n## USB-C Hub Power Cycling & Charging Quirks (as explained\
  \ by Mark, 2025-05-26)\n\n-   **The \"Peripheral Rave\":** A critical aspect of\
  \ my power system involves two USB-C hubs. These hubs not only distribute power\
  \ to my laptop/CPU for charging but also connect almost all of my peripherals (sensors,\
  \ cameras, actuators, face LCD via HDMI out).\n-   **The Problem:** When the main\
  \ power adapter is connected or disconnected, these USB-C hubs (and all connected\
  \ devices) go through a power cycle and reconnection sequence. This causes a \"\
  repopulation\" of the `/dev` tree in Linux.\n-   **Consequences:** This dynamic\
  \ reconnection can cause significant disruption to running ROS nodes and other systems\
  \ that rely on stable device paths. This is a major reason why the automated Kobuki\
  \ dock is not fully utilized for CPU charging and why manual plugging/unplugging\
  \ is preferred despite this issue.\n-   **Kobuki Dock Limitations:**\n    -   The\
  \ Kobuki dock, while providing power to the Kobuki base and potentially the auxiliary\
  \ battery, does not supply enough power (\"oomph\") to charge my main CPU battery.\n\
  \    -   Functionally, using the Kobuki dock would also mean I'm facing the wall\
  \ (the \"naughty robot corner\"), which is suboptimal for interaction and observation.\n\
  -   **My \"Dual Monitor\" Setup:** My native HDMI port uses a wireless HDMI dongle\
  \ to display on one of Mark's desk monitors, effectively giving me a dual-monitor\
  \ setup (my face LCD + his desk monitor for dev/debug). This is independent of the\
  \ USB-C hub HDMI for my face.\n</note>\n</tool>\n<tool_response name=\"notepad\"\
