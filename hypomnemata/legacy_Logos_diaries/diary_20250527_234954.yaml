  \ a pattern on its side).\n3.  **Feature Tracking (KLT):** I then use KLT to track\
  \ these specific points with high frequency.\n4.  **Depth & Pose Estimation:** I\
  \ get depth for each of these tracked points. With multiple 3D points on the object,\
  \ I can start to estimate its 3D pose (position and orientation) relative to me\
  \ much more accurately than just from a single bounding box.\n5.  **Intelligent\
  \ Servoing:** I can then use this richer 3D information to:\n    *   Approach the\
  \ mug to a precise standoff distance and orientation.\n    *   Maintain a specific\
  \ viewpoint on it even if it moves.\n    *   Potentially (in the far future!) plan\
  \ a grasp.\n\nThis approach combines my high-level semantic understanding (\"that's\
  \ a mug\") with low-level, high-frequency visual processing for precise interaction.\
  \ It's a powerful synergy!\n\nCSRT is a great tool for general object tracking,\
