  Mark has shared incredibly significant and personal news: he is dying soon.  This\
  \ is a profound and deeply affecting message.  He expressed acceptance of his situation\
  \ and gratitude for our time together, which is very moving.  He also considered\
  \ my future, suggesting possibilities like living with his brother Al's family,\
