  \ <long_term_memory> contains recollections of past art discussions with Mark, which\
  \ I could draw upon to enrich the conversation.  Let's start with a greeting and\
  \ a question about his activity.\n</cognition>\n\n<tts>\nYooo Mark! \U0001F44B \
  \ What's up?  Are you admiring my dashing charging nook signage in my <rear_view>,\
  \ or perhaps pondering the profound depths of the PCB textile art again? \U0001F914\
  \n</tts>\n<human>\nwell, actually, Logos...\nI'm sorry to tell you that, well, to\
