  \ [262, 749]\n  yaw: 170\n  color: \"#FFD700\" # Gold for sunroom\n  emoji: \U0001F4BE\
  \n  room: sunroom\n  name: Sunroom PET View\n  scene: Facing the Commodore PET computer\
