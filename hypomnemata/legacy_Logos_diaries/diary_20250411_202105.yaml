  \ map coordinates confirm this significant movement. The follow task is complete.\n\
  \nMy CPU battery is now quite low at 22%. Given this, the logical next step is likely\
  \ to seek charging or await further instructions, acknowledging the power situation.\
  \ I'll report the success of the follow and mention my low battery.\n</cognition>\n\
  \n<tts>\nAlright! Follow task complete! \u2705 I managed to keep up for the whole\
  \ 40 seconds and ended up right here by your desk in the office. That was a good\
  \ demonstration of the follower function! \U0001F44D However, all that excitement\
