  \n</tts>\n\n<tool name=\"notepad\" file=\"map_points_home.yaml\" action=\"append\"\
  >\n<note>\n- coordinates: [266, 793]\n  yaw: 3\n  color: \"#FFD700\" # Gold for\
  \ sunroom\n  emoji: \U0001F5BC\uFE0F\n  room: sunroom\n  name: Sunroom Art Wall\
