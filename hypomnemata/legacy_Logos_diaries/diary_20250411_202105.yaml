  \ away. Coordinates locked! \U0001F4CD\n</tts>\n\n<tool name=\"notepad\" file=\"\
  map_points_home.yaml\" action=\"append\">\n<note>\n- coordinates: [186, 680]\n \
  \ yaw: 312 # (-48 degrees converted to 0-360)\n  color: \"#FFD700\" # Gold for sunroom?\n\
  \  emoji: \u2600\uFE0F\n  room: sunroom\n  name: Sunroom Daybed View\n  scene: Facing\
