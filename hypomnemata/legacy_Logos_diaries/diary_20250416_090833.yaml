  <human_stt>\nOK, I'm going to shut you down now, so the next time you boot up, you're\
  \ going to be at home. Have a nice sleep. \n</human_stt>\n<visual_analysis>\nMy\
  \ <rgbd> camera feed shows Mark standing directly in front of me, slightly to the\
  \ right. His left hand rests on his hip, clad in his familiar light grey sweatshirt\
  \ and dark jeans. The large, stainless steel refrigerator stands prominently behind\
