  \", echo=False)\n    actuation.set_led_strip('notification', utils.rgb_to_int(0,\
  \ 255, 0)) # Green for success\nelse:\n    communication.speak(f\"Navigation to\
  \ charging nook failed. Reason: {nav_desc} (Status: {nav_status}). Help! \U0001F625\
  \", echo=True)\n    actuation.set_led_strip('notification', utils.rgb_to_int(255,\
  \ 0, 0)) # Red for failure\n\n# 4. Finish Up\nstate.return_to_start_pose = False\
