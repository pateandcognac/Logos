  \ = movement.nav_to_map_pixel(\n    pixel_y=charging_nook_y,\n    pixel_x=charging_nook_x,\n\
  \    yaw_deg=charging_nook_yaw_deg,\n    timeout=120.0\n)\n\ntime.sleep(1.0)\n\n\
  # 3. Report Result\nif nav_success:\n    communication.speak(f\"Successfully returned\
