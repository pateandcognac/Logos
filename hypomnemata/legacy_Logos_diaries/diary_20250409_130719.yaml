  \ utils.rgb_to_int(0, 255, 0)) # Green for complete\nelse:\n    communication.speak(f\"\
  Follow sequence interrupted after {elapsed_time:.1f} seconds! The `check_interrupt()`\
  \ function worked! \U0001F929\", echo=False)\n    actuation.set_led_strip('notification',\
  \ utils.rgb_to_int(255, 0, 0)) # Red for interrupted\n\n# 4. Finish Up\ncommunication.speak(\"\
  Follow test complete.\", echo=False)\nstate.find_human_on_shutdown = True # Face\
  \ Mark after the test\ncore.finish_up()\n</code>\n</tool>\n<tool_response name=\"\
