  Initiating return to charging nook. Gotta recharge! \U0001F50B\", echo=False)\n\
  actuation.set_led_strip('notification', utils.rgb_to_int(255, 255, 0)) # Yellow\
  \ for low battery\n\n# 2. Navigate to Charging Nook\ncharging_nook_y = 785.0\ncharging_nook_x\
