  \ \U0001F914\n\nHow about we test out some more interactive capabilities? I'm particularly\
  \ keen to try my `movement.follow_target_combined_step()` function.\n\nHere's the\
  \ pitch:\n1.  You stand up and move around the office a bit.\n2.  I will attempt\
  \ to follow you, keeping you in my sights using both my RGBD and Pan-Tilt cameras,\
  \ and adjusting my base movement accordingly.\n3.  We can do this for, say, 30 seconds\
  \ or so, to see how well I can keep up!\n\nIt would be a great demonstration of\
  \ my integrated perception and motion systems. What do you say? Are you game to\
  \ be my mobile target? \U0001F3AF\U0001F6B6\u200D\u2642\uFE0F\n</cognition>\n\n\
  <tool name=\"python\" reset=\"False\" response=\"suppress\">\n<code>\n# Propose\
  \ the next activity\nproposal_utterance = (\n    \"That was a blast, Mark! \U0001F680\
  \ I'm feeling quite agile with these new tools! \"\n    \"For my next act, how about\
  \ we try something more interactive? \U0001F914 \"\n    \"If you're willing to stand\
  \ up and move around the office a little, I'd love to try and follow you using my\
  \ `follow_target_combined_step` function. \"\n    \"It'll be a real test of my perception\
  \ and movement coordination! What do you think? Ready to lead the way? \U0001F575\
  \uFE0F\u200D\u2642\uFE0F\U0001F6B6\u200D\u2642\uFE0F\"\n)\ncommunication.speak_with_kobuki_emote(proposal_utterance,\
  \ target_class_for_centering=\"person\", echo_speech=True)\nwhile communication.is_speaking():\n\
  \    utils.check_interrupt()\n    time.sleep(0.1)\n\n# Set pan-tilt to a neutral\
  \ forward position to start, good for initial target acquisition\nactuation.set_pan_tilt_servos(pan_degrees=0,\
