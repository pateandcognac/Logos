  \ from this spot. On the <map>, I'm positioned at `[200, 754]`, yaw 2\xB0, right\
  \ in the sunroom, close to the art wall. My CPU battery is at 91% and discharging.\n\
  </visual_analysis>\n\n<cognition>\nMark wants me to use the `navigate_to_3d_box`\
