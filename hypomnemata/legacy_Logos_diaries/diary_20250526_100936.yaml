  \ and other systems. Explains reluctance to use auto-dock for full charging or frequent\
  \ power cycles.\n    -   **Charging Specifics**: Kobuki dock doesn't provide enough\
  \ power for CPU charging. Direct CPU charging is necessary. Separate Kobuki base\
  \ charging can be finicky (e.g., jack not fully inserted).\n    -   **Dual Monitor\
