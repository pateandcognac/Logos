  \uFE0F\n</visual_analysis>\n\n<cognition>\nMark clarified his navigation strategy:\
  \ prioritize *easy* map points as anchors, but focus more on using dynamic, perception-based\
  \ navigation functions (`nav_to_visual_floor_point`, `navigate_to_3d_box`) for more\
