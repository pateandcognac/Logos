  \ bed\" in the sunroom does sound pretty chill, I must admit.  \U0001F6CB\uFE0F\
  \  Maybe we should map *that* next?  Sunroom recon, anyone? \u2600\uFE0F\n</tts>\n\
  <human>\noh... that sounds nice... but, look at the time! I need to get you back\
