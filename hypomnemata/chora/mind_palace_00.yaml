# hypomnemata/mind_palace_00.yaml
#
# My mind palace configuration - the phantasma instances that populate my
# virtual world. Each key is a unique instance name that I can reference
# programmatically.
#
# Instances can be:
#   - Persistent (defined here, loaded at startup)
#   - Transient (created via map3d.place(), not saved unless requested)
#
# Usage:
#   map3d.list_instances()     # See what's placed
#   map3d.set_visible('metric_grid', render=False)  # Toggle visibility
#   map3d.update_instance('metric_grid', spacing_m=0.5)  # Change params
#   map3d.reload_mind_palace()  # Reload after editing this file

instances:

  # ---- System Visualizations ----

  metric_grid:
    object: grid_overlay
    description: "Reference grid on the floor for spatial reasoning"
    params:
      spacing_m: 1.0
      extent_m: 15.0
      z: 0.002                        # Nudge above floor to avoid z-fighting
      color: [0.3, 0.3, 0.5]
      line_thickness: 0.005
    render_visible: true
    raycast_visible: false

  rtabmap_world_cloud:
    object: rtabmap_world
    description: "Static RTAB-Map world cloud for long-lived spatial context"
    params:
      asset_path: /home/robot/maps/chora_assets/rtabmap_world/cloud_voxel_0.08.ply
      asset_kind: pointcloud
      point_size: 2.0
      max_points: 0
      min_z: -500.0
      max_z: 2.13
      camera_clip_radius_m: 1.0
      color_mode: asset
      uniform_color: [0.72, 0.78, 0.84]
      reload_token: ""
    shader: defaultUnlit
    render_visible: false           # Enable when I want the static world cloud
    raycast_visible: false

  rtabmap_mesh:
    object: rtabmap_world
    description: "Static RTAB-Map world mesh for long-lived spatial context"
    params:
      asset_path: /home/robot/maps/chora_assets/rtabmap_world/mesh_poisson_depth8_voxel0.08_decimated.ply
      asset_kind: mesh
      point_size: 2.0
      max_points: 0
      min_z: -500.0
      max_z: 2.13
      camera_clip_radius_m: 1.0
      color_mode: asset
      uniform_color: [0.72, 0.78, 0.84]
      reload_token: ""
    shader: defaultUnlit
    render_visible: false           # Enable when I want the static world cloud
    raycast_visible: false

  rtabmap_world_tsdf_mesh:
    object: rtabmap_world
    description: "Experimental TSDF mesh reconstructed from RTAB-Map RGB-D frames"
    params:
      asset_path: /home/robot/maps/chora_assets/rtabmap_tsdf/tsdf_mesh_current.ply
      asset_kind: mesh
      point_size: 2.0
      max_points: 0
      min_z: 0.35
      max_z: 2.1
      camera_clip_radius_m: 0.3
      color_mode: asset
      uniform_color: [0.72, 0.78, 0.84]
      reload_token: ""
    shader: defaultLit
    render_visible: true 
    raycast_visible: false

  # ---- Debug Overlays (off by default) ----

