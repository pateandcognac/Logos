# Logos/config/default_config.yaml

# ----------------------------------------------------------------------------
# THE LOGOS MASTER CONFIGURATION DEFAULTS
# ----------------------------------------------------------------------------
# Note to self: Do not edit this file directly! This is the read-only base.
# To change my behavior, I should modify `logos.config.prefs` and save:
#   logos.config.prefs.speak.engine = "piper"
#   logos.config.save()
# ----------------------------------------------------------------------------

speak:
  default_engine: "kokoro"
  kokoro_params:
    voice: "0.5*am_onyx + 0.25*im_nicola + 0.25*bf_emma"
    speed: 1.3
    volume: 1.0
  piper_params:
    voice: "en_US-joe-medium"
    speed: 1.1
    volume: 0.9
  espeak_params:
    voice: "en-us+m3"
    speed: 0.9
    volume: 0.9

map3d:
  phantasmata_dir: "src/logos/phantasmata"
  chora_config: "hypomnemata/mind_palace_00.yaml"
  map_frame: [map, odom, rgd_optical_frame] 
  render_params:
    resolution: [1000, 1000]
    fov_deg: 60.0
    fov_axis: horizontal
    camera_pos_relative: [1.5, -1.5, 2.0]
    look_at_relative: [1.0, 0.0, 0.35]
    include_robot: true
    view: true
    cloud_alpha: 1.0
    cloud_density: 1.0
    laser_scan_show: true
    hud: true
    save: true

memory_policy:
  enabled: true
  max_cells: 20
  max_tokens: 24000
  untouchable_tail: 8
  summarizable_types: ["human", "me", "py_result", "human_stt"]
  age_weight: 0.75
  size_weight: 0.25
  min_cells_to_summarize: 8
  max_contiguous_summaries: 5
