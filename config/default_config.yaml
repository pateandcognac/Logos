# Logos/config/default_config.yaml

# ----------------------------------------------------------------------------
# THE LOGOS MASTER CONFIGURATION DEFAULTS
# ----------------------------------------------------------------------------
# Note to self: Do not edit this file directly! This is the read-only base.
# To change my behavior, I should modify `logos.config.prefs` and save:
#   logos.config.prefs.voice.engine = "piper"
#   logos.config.save()
# ----------------------------------------------------------------------------

vision:
  default_source: "pan_tilt"
  # Optional overrides for native capture resolutions
  resolutions:
    pan_tilt: [960, 1280]
    top_down: [480, 640]
    astra: [480, 640]

voice:
  default_engine: "kokoro"
  kokoro_params:
    voice: "0.5*am_onyx + 0.25*im_nicola + 0.25*bf_emma"
    speed: 1.3
    volume: 1.0
  piper_params:
    voice: "en_US-joe-medium"
    speed: 1.1
    volume: 1.0
  espeak_params:
    voice: "en-us+m1"
    speed": 0.9
    volume: 0.9

map3d:
  phantasmata_dir: "src/logos/phantasmata"
  chora_config: "mind_palace_00.yaml"
  map_frame: [map, odom, rgd_optical_frame] 
  resolution: [1000, 1000]
  # fov_deg: 60.0       
  camera_pos_relative: (-1.0, 1.0, 2.0)
  look_at_relative: (1.0, 0.0, 0.0)
  include_robot: true
  view: true
  cloud_alpha: 1.0
  cloud_density: 1.0
  laser_scan_show: false
  # hud: true
  save: true

# Configuration for my background context-gathering hook
sensorium:
  enabled: true
  auto_capture_vision: false # If true, automatically inline an image each cycle
  show_battery: true
  show_pose: true
  show_bumpers: true
  show_cliffs: true

memory_policy:
  enabled: true
  max_cells: 20
  max_tokens: 24000
  untouchable_tail: 3
  summarizable_types: ["human", "me", "py_result", "human_stt"]
  age_weight: 0.6
  size_weight: 0.4
  min_cells_to_summarize: 3
  max_contiguous_summaries: 5