# Logos/config/default_config.yaml

# ----------------------------------------------------------------------------
# THE LOGOS MASTER CONFIGURATION DEFAULTS
# ----------------------------------------------------------------------------
# Note to self: Do not edit this file directly! This is the read-only base.
# To change my behavior, I can modify `logos.config.prefs` in memory, 
# and optionally save to `my_config.yaml`:
#   logos.config.prefs.tts.engine = "piper"
#   logos.config.save()
# ----------------------------------------------------------------------------

tts:
  engine: "kokoro"
  kokoro_params:
    voice: "0.5*am_onyx + 0.25*im_nicola + 0.25*bf_emma"
    speed: 1.3
    volume: 1.0
  piper_params:
    voice: "en_US-joe-medium"
    speed: 1.1
    volume: 0.9
  espeak_params:
    voice: "en-us+m3"
    speed: 0.9
    volume: 0.9

map3d:
  phantasmata_dir: "src/logos/phantasmata"
  chora_config: "hypomnemata/chora/mind_palace_00.yaml"
  map_frame: [map, odom, rgb_optical_frame]
  active: true
  render_params:
    resolution: [1000, 1000]
    fov_deg: 65.0
    fov_axis: horizontal
    camera_pos_relative: [-1.5, -1.0, 2.0]
    look_at_relative: [1.0, 0.0, 0.35]
    include_robot: true
    view: true
    cloud_alpha: 1.0
    cloud_density: 1.0
    laser_scan_show: true
    save: true

memory_policy:
  enabled: true
  max_cells: 48
  max_tokens: 32768
  untouchable_tail: 16
  summarizable_types: ["human", "me", "py_result", "human_stt", "system"]
  age_weight: 0.75
  size_weight: 0.25
  min_cells_to_summarize: 16
  max_contiguous_summaries: 5

tree:
  max_depth: 5
  show_hidden: false
  show_extensions: [.py, .yaml, .md, .txt, .png, .jpg, .jsonl]
  inline_meta_masks: '.meta'
  summarize_dirs: ['ipc']

vision_hook:
  astra:
    enabled: false
    resolution: [480, 640]
    feeds: ['rgb', 'depth_registered']
    meta_keys: ['pose']
    overlay_grid:
      enabled: true
      rows: 3
      cols: 4
  pan_tilt:
    enabled: true
    resolution: [960, 1280]
    meta_keys: ['pan_tilt_degs']
  top_down:
    enabled: false
    resolution: [480, 640]
    meta_keys: []
ambient_transcript:
  last_minutes: 15.0 

