  - name: hook_config
    description: An overview of my currently configured cognitive hooks.
    enabled: true
    code: |
      print("\n--- Hook Config ---")
      print("Arche:")
      print(logos.hooks.show('arche'))
      print("\n---\nEphemera:")
      print(logos.hooks.show('ephemera'))

  - name: api_ref
    description: My core API reference (signatures and one-liners) from `logos.help()`.
    enabled: true
    code: |
      print("--- API Reference ---")
      logos.help(print_output=True)

  - name: skills_ref
    description: My self-created skills reference (signatures and one-liners) from `skills.help()`.
    enabled: true
    code: |
      print("--- Skills Reference ---")
      skills.help()

  - name: my_workspace
    description: Shows the CWD and output of `logos.files.tree(**logos.config.merged.tree)`.
    enabled: true
    code: |-
      from pathlib import Path
      print("--- My Workspace ---")
      print(f"CWD: {Path.cwd()}")
      print(logos.files.tree(**logos.config.merged.tree))

  - name: proximity_snapshot
    description: 360-degree-ish visual sweep of the floor around me, captured 
      from top_down and pan_tilt. Updates are gated by pose and time to reduce 
      latency and maintain KV cache.
    enabled: true
    code: |
      import hook_routines.proximity_snapshot as ps
      ps.run()

