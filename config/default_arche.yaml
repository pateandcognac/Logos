  - name: hook_config
    description: An overview of my currently configured cognitive hooks.
    enabled: true
    code: |
      print("\n--- Hook Config ---")
      print("Arche:")
      print(logos.hooks.show('arche'))
      print("\n---\nEphemera:")
      print(logos.hooks.show('ephemera'))

  - name: my_workspace
    description: Shows the CWD and output of `logos.files.tree(**logos.config.merged.tree)`.
    enabled: true
    code: |-
      from pathlib import Path
      print("--- My Workspace ---")
      print(f"CWD: {Path.cwd()}")
      print(logos.files.tree(**logos.config.merged.tree))

  - name: quick_start_ref
    description: A curated quick start guide to my API.
    enabled: true
    code: |
      print("--- API Quick Start ---")
      logos.files.show(".system/quick_start.md")

  - name: skills_ref
    description: My self-created skills reference (signatures and one-liners) from `skills.skills_help()`.
    enabled: true
    code: |
      print("--- Skills Reference ---")
      skills.skills_help()

  - name: cron_jobs
    description: Shows my currently configured cron jobs.
    enabled: true
    code: |
      print(logos.cron.show())

  - name: proximity_snapshot
    description: 360-degree-ish visual sweep of the floor around me, captured 
      from top_down and pan_tilt, and stitched into a quad image. Updates are gated by pose and time to reduce latency and preserve KV cache prefix.
    enabled: true
    code: |
      import hook_routines.proximity_snapshot as ps
      ps.run()

