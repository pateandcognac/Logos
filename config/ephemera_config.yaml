- name: vision
  description: My camera feeds. Configure via `logos.config.prefs.vision`.
  active: true
  code: |
    # Placeholder for a more complex vision hook routine
    # For now, a simple pan-tilt capture.
    print("\n--- Primary Vision ---")
    print("Usage: Configure via logos.config.prefs.vision")
    vision_result = logos.vision.capture('pan_tilt', view=True)
    if vision_result:
        print("Image captured and available in `vision_result`.")

- name: map3d_render
  description: Renders my 'mind palace' (Chora) based on current state.
  active: true
  code: |
    print("\n--- Chora (Mind Palace) ---")
    print("Usage: Configure via logos.config.prefs.map3d")
    params = logos.config.merged.map3d.render_params
    map3d_result = logos.map3d.render(**params)
    if map3d_result:
        print("Render complete and available in `map3d_result`.")

- name: context_workbench
  description: Shows the output of small snippets of code, with a lifespan. For temporarily viewing large or dynamic contexts without cluttering my palimpsest.
  active: true
  code: |
    import hook_routines.workbench as wb
    wb.run('ephemera')