- name: vision_hook
  description: My primary camera feeds. Configure via `logos.config.prefs.vision_hook`.
  active: true
  code: |
    import hook_routines.vision as v_hook
    _vision_res = v_hook.run()
    
    # Inject variables directly into my global namespace
    pan_tilt_result = _vision_res.get('pan_tilt')
    astra_result = _vision_res.get('astra')
    top_down_result = _vision_res.get('top_down')

- name: map3d_render
  description: Renders 
  active: true
  code: |
    print("\n--- Chora ---")
    print("Usage: Configure via logos.config.prefs.map3d")
    if logos.config.merged.map3d.active == True:
        params = logos.config.merged.map3d.render_params
        map3d_result = logos.map3d.render(**params, verbosity=Verbosity.SILENT)
        if map3d_result:
            print("Render complete and available in `map3d_result`.")
    else:
        print("map3d rendering not active.")

- name: context_workbench
  description: Shows the output of small snippets of code, with a lifespan. For temporarily viewing large or dynamic contexts without cluttering my palimpsest.
  active: true
  code: |
    import hook_routines.workbench as wb
    wb.run('ephemera')