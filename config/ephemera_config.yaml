  - name: dashboard
    description: Real-time status (pose, battery, time, loop count, Python memory usage). Performs palimpsest summarization if needed.
    enabled: true
    code: |
      import hook_routines.dashboard as d
      d.run()

  - name: rag_context
    description: Automatically surfaces relevant API docs, examples, and memories based on recent input. Modify behavior with `logos.config.prefs.rag_hook`
    enabled: true
    code: |
        import hook_routines.rag_context as rc
        rc.run()

  - name: ambient_transcript
    description: A rolling transcript of ambient speech not directed at me.
    enabled: true
    code: |
      print("--- Ambient Transcript ---")
      print("Usage: Control via `logos.config.prefs.ambient_stt.last_minutes`.")
      import hook_routines.ambient_transcript
      hook_routines.ambient_transcript.run()

    active: true
  - name: vision_hook
    description: My primary camera feeds. 
    enabled: true
    code: |
      print("--- Vision Hook ---")
      print("Configure via `logos.config.prefs.vision_hook`.")
      import hook_routines.vision as v_hook
      _vision_res = v_hook.run()
      # Inject variables directly into my global namespace
      pan_tilt_result = _vision_res.get('pan_tilt')
      astra_result = _vision_res.get('astra')
      top_down_result = _vision_res.get('top_down')

  - name: map3d_render
    description: Renders a view into my Chora using `logos.config.prefs.map3d`
    enabled: true
    code: |
      print("--- map3d Render ---")
      print("Usage: Configure via `logos.config.prefs.map3d`")
      if logos.config.merged.map3d.enabled == True:
          params = logos.config.merged.map3d.render_params
          fn=logos.utils.make_time_id()
          map3d_result = logos.map3d.render(filename=fn, **params, verbosity=Verbosity.SILENT)
          # if logos.config.merged.map3d.render_params.laser_scan_show == True:
              # print("Simulated laser_scan shown at Z=0.70")
          if map3d_result:
              print("map3d RenderResult available in `map3d_result`.")
      else:
          print("map3d rendering not enabled.")

  - name: context_workbench
    description: Shows the output of small snippets of code, with a 
      loops-to-live (ltl) lifespan. For temporarily viewing large or dynamic 
      contexts without cluttering my palimpsest.
    enabled: true
    code: |-
      import hook_routines.workbench
      hook_routines.workbench.run('ephemera', globals())

