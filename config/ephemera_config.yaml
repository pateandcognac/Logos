- name: the_basics
  description: Shows time, battery, and logos.config
  active: true
  code: |-
    import datetime, time, logos
    print(f"# Current time: {datetime.datetime.now().strftime('%Y-%m-%d %H:%M:%S')}\n")
    batt = logos.base.get_battery()
    print(f"Battery {batt['percentage']}% ({batt['status']})\nCharger: {logos.base.get_charger_state()}")
    print(logos.config)

- name: manage_memory
  description: Automatically summarizes my io_buffer based on my memory_policy.
  active: true
  code: |-
    # This hook's logic is complex, so it's defined in a separate file
    # for clarity and maintainability.
    try:
        from hook_routines import memory_manager
        memory_manager.run_policy_check()
    except ImportError as e:
        # This might happen on the very first run if paths are still setting up
        print(f"Warning: Could not import memory_manager hook: {e}")
    except Exception as e:
        print(f"Error during memory management: {e}")

- name: vision_reflex
  description: "The Retinal Flash. Captures live images based on configuration."
  active: true
  code: |
    # We import and run the routine from the file to keep this YAML clean.
    # The variables it creates (astra_img, pt_seq) will persist in the global scope!
    import hook_routines.vision_hook
    import importlib
    # importlib.reload(hook_routines.vision_hook) # Force reload to pick up changes!
    hook_routines.vision_hook.run()
    print("# astra_img and pt_seq available in global scope")

- name: chora
  description: "A projection of my mind's eye."
  active: true
  code: |
    cpr=logos.config.merged.get
    chora = logos.map3d.render(camera_pos_relative = [1.0, 0.5, 2.0],look_at_relative = [0.5, 0, 0.35])
    print("# chora variable contains RenderResult of map3d")
