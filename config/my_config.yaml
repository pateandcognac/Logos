# Logos/config/default_config.yaml

# ----------------------------------------------------------------------------
# THE LOGOS MASTER CONFIGURATION DEFAULTS
# ----------------------------------------------------------------------------
# Note to self: Do not edit this file directly! This is the read-only base.
# To change my behavior, I should modify `logos.config.prefs` and save:
#   logos.config.prefs.speak.engine = "piper"
#   logos.config.save()
# ----------------------------------------------------------------------------


speak:
  default_engine: "kokoro"
  kokoro_params:
    voice: "0.5*am_onyx + 0.25*im_nicola + 0.25*bf_emma"
    speed: 1.3
    volume: 1.0
  piper_params:
    voice: "en_US-joe-medium"
    speed: 1.1
    volume: 1.0
  espeak_params:
    voice: "en-us+m1"
    speed": 0.9
    volume: 1.0

# map3d:

# Configuration for my background context-gathering hook


memory_policy:
  enabled: true
  max_cells: 20
  max_tokens: 24000
  untouchable_tail: 3
  summarizable_types: ["human", "me", "py_result", "human_stt"]
  age_weight: 0.6
  size_weight: 0.4
  min_cells_to_summarize: 3
  max_contiguous_summaries: 5