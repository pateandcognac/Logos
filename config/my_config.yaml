files:
  show_extensions: [.py, .yaml, .md, .txt, .json, .png]
  max_depth: 5
  inline_meta_masks: ['*.meta']
  show_hidden: false
memory_policy:
  enabled: true
  max_cells: 64
  max_tokens: 24567
  untouchable_tail: 8
  min_cells_to_summarize: 16
  summarizable_types: [me, py_result, py_async, human, human_stt]
  age_weight: 0.75
  size_weight: 0.25
  max_contiguous_summaries: 4
system: {save_state_on_loop: true}
map3d:
  map_frame: [map, odom, rgd_optical_frame]               # List in preference order
  chora_config: mind_palace_00.yaml  # Within Logos/config/
  phantasmata_dir: phantasmata/         # Within src/logos/ API dir
vision:
  chora_defaults:                     # Override built-in render() defaults
    resolution: [768, 768]              # [height, width]
    fov_deg: 60.0                       # Vertical FOV in degrees
    camera_pos_relative: [-1.0, 1.0, 2.0]
    look_at_relative: [1.0, 0.0, 0.0]
    include_robot: true
    view: true
    cloud_alpha: 1.0
    cloud_density: 1.0
    laser_scan_show: false
    show_hud: true
    save_unique: false
    # save_unique: false → overwrites artifacts/chora/latest_render.png + sidecar
    # save_unique: true  → ADDITIONALLY saves with logos.utils.make_time_id()
    #                       base36 7-char ID as filename for png + sidecar
  hook_captures:
    - source: astra
      active: true
      view: true
      var_name: astra_img
      resolution: [480, 640]
      astra_feeds: [rgb, depth_registered]
    - source: pan_tilt
      active: true
      view: true
      var_name: pt_seq
      pt_sequence:
        - pan: 0
          tilt: 0
          resolution: [600, 800]
        - pan: 0
          tilt: -60
          resolution: [288, 384]
