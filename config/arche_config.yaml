- name: hook_configs
  description: A summary of my active cognitive hooks.
  active: true
  code: |
    import time
    from logos.core import verbosity, check_for_interrupt, help, Verbosity
    print("\n--- Cognitive Hook Status ---")
    print("Arche:")
    print(logos.hooks.show('arche'))
    print("\nEphemera:")
    print(logos.hooks.show('ephemera'))

- name: api_dump
  description: My core API reference (signatures and one-liners).
  active: true
  code: |
    print("--- Logos API Reference ---")
    logos.help(print_output=True)

- name: file_tree
  description: Shows the output of logos.files.tree(**logos.config.merged.tree)
  active: true
  code: |-
    from pathlib import Path
    print("--- My Workspace ---")
    print(f"CWD: {Path.cwd()}")
    print(logos.files.tree(**logos.config.merged.tree))

- name: Logos_photo
  description: A photograph Mark took of me, idling in my cozy charging nook. Overlaid with my self_model.py code as an experiment in ViT compression.
  active: true
  code: |-
    print('<file path="images/Logos_with_self_model.py_overlay.png"></file>')

- name: proximity_snapshot
  description: 360-degree-ish visual sweep of the floor immediately surrounding me. Updates are gated by pose and time.
  active: true
  code: |
    import hook_routines.proximity_snapshot as ps
    ps.run()
