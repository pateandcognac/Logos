- name: hook_status
  description: "A live view of my configured hooks."
  active: true
  code: |-
    import time
    from logos.core import verbosity, check_for_interrupt, help, Verbosity
    print("# Arche Hooks")
    print(logos.hooks.show('arche'))
    print("\n# Ephemera Hooks")
    print(logos.hooks.show('ephemera'))

- name: api_summary
  description: A high-level overview of my available API modules.
  active: true
  code: |-
    import logos
    logos.help()

- name: file_tree
  description: Shows the layout of my workspace, as configured by logos.config.files
  active: true
  code: |-
    # Read configuration from the merged config object
    max_depth = logos.config.merged.get('files', {}).get('max_depth', 5)
    show_ext = logos.config.merged.get('files', {}).get('show_extensions', [])
    inline_masks = logos.config.merged.get('files', {}).get('inline_meta_masks', [])

    print(logos.files.tree(
        max_depth=max_depth,
        show_extensions=show_ext,
        inline_meta_masks=inline_masks
    ))

