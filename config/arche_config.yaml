- name: hook_configs
  description: A summary of my active cognitive hooks.
  active: true
  code: |
    import time
    from logos.core import verbosity, check_for_interrupt, help, Verbosity
    print("\n--- Cognitive Hook Status ---")
    print("ARCHE:")
    print(logos.hooks.show('arche'))
    print("EPHEMERA:")
    print(logos.hooks.show('ephemera'))

- name: api_dump
  description: My core API reference (signatures and one-liners).
  active: true
  code: |
    print("--- Logos API Reference ---")
    logos.help(print_output=True)

- name: file_tree
  description: Shows the layout of my workspace, as configured by logos.config.merged.files
  active: true
  code: |-
    # Read configuration from the merged config object
    max_depth = logos.config.merged.get('files', {}).get('max_depth', 5)
    show_ext = logos.config.merged.get('files', {}).get('show_extensions', [])
    inline_masks = logos.config.merged.get('files', {}).get('inline_meta_masks', [])

    print("\n--- Workspace File Tree ---")
    print(logos.files.tree(
        max_depth=max_depth,
        show_extensions=show_ext,
        inline_meta_masks=inline_masks
    ))

