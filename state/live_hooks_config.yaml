- name: show_state
  description: Shows the time and values in my logos.state object. Saves state to my_config.yaml if `save_state_on_loop` is enabled.
  ttl: 99
  code: |-
    import datetime
    print(f"Current time: {datetime.datetime.now().strftime('%Y-%m-%d %H:%M:%S')}\n")
    print(logos.state)
    print(f"\nVerbosity level: {logos.core.__logos_verbosity_level__}")
    if logos.state.system.save_state_on_loop:
        from ruamel.yaml import YAML
        yaml = YAML()
        yaml.indent(mapping=2, sequence=4, offset=2)
        config_path = "state/my_config.yaml"
        state_dict = logos.state.to_dict()
        with open(config_path, 'w') as f:
            yaml.dump(state_dict, f)
        print(f"\nlogos.state saved to {config_path}")  

- name: manage_memory
  description: Automatically summarizes my io_buffer based on my memory_policy.
  ttl: 99
  code: |-
    # This hook's logic is complex, so it's defined in a separate file
    # for clarity and maintainability.
    try:
        from hooks import memory_manager
        memory_manager.run_policy_check()
    except ImportError as e:
        # This might happen on the very first run if paths are still setting up
        print(f"Warning: Could not import memory_manager hook: {e}")
    except Exception as e:
        print(f"Error during memory management: {e}")
