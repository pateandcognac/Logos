- name: hook_status
  description: "A live view of my configured hooks."
  ttl: 99 # Run every loop and stay pinned
  code: |-
    print("# Arche Hooks")
    print(logos.hooks.show('arche'))
    print("\n# Ephemera Hooks")
    print(logos.hooks.show('ephemera'))

- name: api_summary
  description: A high-level overview of my available API modules.
  ttl: -99
  code: |-
    import logos
    logos.help()

- name: file_tree
  description: Shows the layout of my workspace, as configured by logos.state.files
  ttl: 99
  code: |-
    # Read configuration from the state object
    max_depth = logos.state.files.max_depth
    show_ext = logos.state.files.show_extensions
    inline_masks = logos.state.files.inline_meta_masks

    print(logos.files.tree(
        max_depth=max_depth,
        show_extensions=show_ext,
        inline_meta_masks=inline_masks
    ))

- name: Logos_photo
  description: A photograph Mark took of me, idlin' in my cozy charging nook
  ttl: -99
  code: |-
    print('<file path="images/Logos_512x384.jpg"></file>')
