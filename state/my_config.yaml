files:
  show_extensions:
  - .py
  - .yaml
  - .md
  - .txt
  - .json
  - .png
  max_depth: 5
  inline_meta_masks:
  - '*.meta'
  - README.md
system:
  save_state_on_loop: true
memory_policy:
  enabled: true
  max_cells: 64
  max_tokens: 24567
  untouchable_tail: 8
  min_cells_to_summarize: 5
  summarizable_types:
  - me
  - py_result
  - py_async
  - human
  - human_stt
  age_weight: 0.6
  size_weight: 0.4
  max_contiguous_summaries: 4

